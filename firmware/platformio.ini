; Firmware do Alimentador de Pet IoT — ver specs/04-firmware.md
; pio run              → compila para o ESP32
; pio test -e native   → testes da lógica pura (lib/core) no PC

[platformio]
default_envs = esp32

[env]
lib_deps =
  bblanchon/ArduinoJson@^7.2.1

[env:esp32]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DMQTT_MAX_PACKET_SIZE=8192
lib_deps =
  ${env.lib_deps}
  madhephaestus/ESP32Servo@^3.0.6
  bogde/HX711@^0.7.5
  knolleary/PubSubClient@^2.8
  tzapu/WiFiManager@^2.0.17
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
lib_compat_mode = off
