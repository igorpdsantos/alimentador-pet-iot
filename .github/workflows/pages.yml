# Publica a pasta site/ no GitHub Pages a cada push na main que mexe nela,
# com o app PWA (app/) compilado em site/app/ → https://<usuário>.github.io/alimentador-pet-iot/app/
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["site/**", "app/**", "tools/protocol-fixtures/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Sem .env: o app publicado não leva credencial nenhuma; o broker é informado no pareamento.
      - name: Testar e compilar o app
        working-directory: app
        run: |
          npm ci
          npx vitest run
          npm run build
      - run: cp -r app/dist site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
