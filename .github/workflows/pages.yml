# Publica a pasta site/ no GitHub Pages a cada push na main que mexe nela,
# com o app PWA (app/) compilado em site/app/ → https://<usuário>.github.io/alimentador-pet-iot/app/
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["site/**", "app/**", "tools/protocol-fixtures/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # O app publicado leva só o endereço do broker (público). Usuário e senha vêm do código de pareamento
      # pf-xxxxxx-segredo de cada alimentador (D24); nenhuma credencial vai no app.
      - name: Testar e compilar o app
        working-directory: app
        env:
          VITE_MQTT_URL: wss://j0125f61.ala.us-east-1.emqxsl.com:8084/mqtt
        run: |
          npm ci
          npx vitest run
          npm run build
      - run: cp -r app/dist site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
